,L=(e,t)=>({key:e,text:t}),pn=[{id:1,stem:"你是如何看待公司和员工的关系？",type:"single",options:[L("A","是一种纯粹的契约关系：公司支付薪水，我付出相应的劳动。工作范围之外的事，我不愿过多参与。"),L("B","公司是一个平台，我借助这个平台提升自己的能力。当我有更好的发展机会时，我会选择离开。"),L("C","公司是另一个「家」，是事业共同体。一荣俱荣，一损俱损。我愿意与公司共同成长，为它的发展全力以赴，并在此过程中实现个人价值。"),L("D","管理者与被管理者的关系。我做好分内的事，公司按规定给我报酬即可，不希望公司过多干预我的个人生活。")]},{id:2,stem:"当你发现工作中出现了一个可能对公司造成损失的错误，而这个错误主要是由你造成的，你会如何处理？",type:"single",options:[L("A","立即直接向上级汇报，主动承认错误，并积极想办法补救，将损失降到最低。"),L("B","先尝试自己悄悄解决，如果能掩盖过去就当没发生；如果解决不了再上报。"),L("C","评估错误的严重性，如果不严重就隐瞒下来；如果严重再找机会推脱或解释。"),L("D","与关系好的同事商量，看看他们的建议，再决定怎么做。")]},{id:3,stem:"当你在工作中需要学习新的复杂业务技能时，你通常会如何开展？",type:"single",options:[L("A","主动在 1 天内通过快速查阅资料、请教同事等方式，迅速掌握核心要点。"),L("B","用大概一周时间，系统梳理学习资料，逐步尝试实践操作来掌握。"),L("C","花费大概半个月，先全面了解业务背景，再分模块深入学习并练习。"),L("D","觉得需要一个月以上，先慢慢熟悉相关基础，再逐步攻克复杂部分。")]},{id:4,stem:"上司领导刚刚开完会，宣布了一些决定和政策，自己感觉很难适应或做不了，跟自己之前的工作习惯有冲突、不适应，你一般会怎么做？",type:"single",options:[L("A","会去做，但先不跟上司反馈自己不习惯，有委屈自己扛。"),L("B","开完会，立即跟领导沟通一下，讲一下自己不习惯的原因，希望上司帮自己调整。"),L("C","会去做，但是事后找领导谈这个事情，跟领导反馈这个问题。"),L("D","自己是直性格，在会上跟领导提这个问题，非常了解自己的能力，如果做，自己肯定做不好，不想浪费老板和公司的时间。")]},{id:5,stem:"你选择一家公司去上班，以下 10 个因素，请选择你最关心的三个因素并做排序。",hint:"从左到右依次点选，第 1 个是你最关心的。选满 3 项自动进入下一题。",type:"rank",options:[L("A","通勤距离"),L("B","底薪一般（不高不低），但是提成比例明显比其他外贸公司高。"),L("C","底薪比市场高，但是提成比例比市场低。"),L("D","公司办公环境"),L("E","同事之间的氛围"),L("F","公司的平台和客户资源"),L("G","公司的额外福利（比如有薪假或旅游外出）"),L("H","岗位的晋升渠道和发展空间"),L("I","公司刚起步，资源不多，但是保底工资高。"),L("J","公司在这个行业沉淀很久，资源多，成单概率大，但是保底工资不高。")]},{id:6,stem:"当工作需要你临时调整办公地点（如短期去外地项目现场）时，你的态度是？",type:"single",options:[L("A","非常乐意，能快速收拾好行李出发，且能迅速适应新办公环境开展工作。"),L("B","可以接受，但希望提前了解清楚安排，以便做好个人事务协调。"),L("C","有点不太愿意，更倾向于在固定熟悉的办公地点工作。"),L("D","完全不愿意，坚决不接受临时调整办公地点的安排。")]},{id:7,stem:"你认为「做好自己的本职工作」和「主动协助同事处理紧急任务」，两者的关系是？",type:"single",options:[L("A","先确保本职工作无疏漏，再在能力范围内协助同事；若时间冲突，提前和同事、上级同步情况。"),L("B","优先协助同事，毕竟团队协作更重要，自己的工作晚点做。"),L("C","只做好本职工作，同事的任务与自己无关。"),L("D","看和同事的关系，关系好就帮，关系一般就不帮。")]},{id:8,stem:"如果后期公司录用你，但是入职前需要对你做一个前公司背调，需要你提供前公司信息，你是否能配合和接受？",type:"single",options:[L("A","可以接受"),L("B","不能接受，过去的公司不想再提了")]},{id:9,stem:"工作中遇到自己完全没接触过的任务（如从未用过的工具、不熟悉的流程），你会怎么做？",type:"single",options:[L("A","先主动查阅资料、请教有经验的同事，尝试制定初步方案，遇到卡点再及时向上级反馈。"),L("B","直接找上级说「不会做」，请求安排其他人或提供详细指导。"),L("C","先拖延几天，等上级追问时再说明「不熟悉，需要时间」。"),L("D","由于不懂，先按照自己的理解做，做不出来再告诉领导自己不会做。")]},{id:10,stem:"连续多日需要处理繁琐重复的工作（如整理数据、核对信息），你的状态会是？",type:"single",options:[L("A","找理由申请调换任务，不想做重复工作。"),L("B","按要求完成，但会抱怨工作枯燥，影响心情。"),L("C","保持耐心完成，同时思考是否有简化流程、提升效率的方法（如制作模板、分类统计）。"),L("D","为节省时间，简化部分步骤（如少核对几次、省略备注）。")]},{id:11,stem:"你在工作当中，到了下班点，你的上司领导交代了一些紧急事情，需要你尽快处理完，这个时候你会怎样处理这个事情？",type:"single",options:[L("A","原则性很强，到点了就应该下班，工作的事情本来就要在上班时间完成；上班我一定会做，但是下班了不能接受工作安排。"),L("B","看当天情况，如果没有什么事情，就帮领导做完下班；如果有事情，先下班明天再做。"),L("C","下班了先回去，晚上可以回家尝试给上级领导处理，只是不喜欢在公司加班处理。"),L("D","第一时间先帮上级领导处理完紧急事情，然后下班。")]},{id:12,stem:"有些公司会举行一些复盘会或者培训会，目的都是帮助你去成长和找出问题、提高你的技能，但是可能会在下班后或者周末休息日举行（没有加班费）。你是怎样看待这个事情？",type:"single",options:[L("A","偶尔几次可以，但是每次这样不能接受。"),L("B","不能接受，觉得开会就应该在上班时间和工作时间。"),L("C","如果开会的目的是找出问题和帮助我去成长，可以尝试接受非工作时间的会议。"),L("D","如果平时工作下班后可以接受，但是周末举行不接受，因为周末本来就是放假休息的。")]},{id:13,stem:"在非工作时间，比如晚上或周末休息时候，上级领导或老板打电话给下属，安排一些事情或需要来公司处理一些事情，这个时候你会怎么处理这个事情？",type:"single",options:[L("A","不协助，周末和晚上本来就是休息的，员工应该有属于自己的自由时间。"),L("B","偶尔几次会协助，但是经常这样，不能接受。"),L("C","会委婉找一个理由，但不得罪领导，推脱自己有事情协助不了。"),L("D","会看是什么事情，如果力所能及的事情，愿意协助。")]},{id:14,stem:"当你来到一家企业上班，公司告诉你，你的薪酬里面大约 15%-20% 是要作为绩效 KPI 考核的，请问你是怎么看待绩效考核这个事情的？",type:"single",options:[L("A","接受不了，只要有绩效考核就不接受，绩效感觉就是扣员工钱的。"),L("B","要看下绩效考核的内容，如果里面大部分比例都是结果考核，过程考核非常少，不能接受。"),L("C","如果绩效考核中，过程分和结果分比例比较合理，可以接受。"),L("D","能接受，正规一个企业都是有绩效考核的，但是不要超过 20%，绩效就是对员工能力的评估。")]},{id:15,stem:"当下有些公司要求员工上班使用工作手机或企业微信进行日常工作，不允许使用个人手机或个人微信进行日常工作。请问你对这个工作手机和企业微信怎么看？",type:"single",options:[L("A","不接受用工作手机和企业微信进行日常工作，一下使用工作手机、一下使用企业微信，不习惯。"),L("B","上班期间可以接受用工作手机和企业微信，但是下班了不愿意带工作手机，也不愿意查看企业微信。"),L("C","对使用工作手机还是企业微信都无所谓，自己随性，想到什么时候用就什么时候用。"),L("D","能接受，可以接受一直用工作手机和企业微信进行日常工作，个人手机和业务手机本来就应该分开。")]},{id:16,stem:"在职业发展中，你更认同以下哪种关于「独立与依赖」的价值观？",type:"single",options:[L("A","高度独立自主：坚信一切成就必须依靠自己，极少寻求或接受他人帮助，甚至不愿与他人合作。"),L("B","适度依赖共赢：坚持个人努力为主，但在遇到瓶颈时愿意主动寻求帮助，并通过合作实现共同目标。"),L("C","被动依赖他人：习惯将困难归因于外部环境，期待他人或公司为自己解决问题，缺乏主动突破的意识。"),L("D","完全依赖外部：认为个人努力无关紧要，成功主要依赖他人支持或运气，不愿承担独立责任。")]},{id:17,stem:"你在和外部人员（如客户、合作方）沟通时，对方询问「公司内部的数据」（如成本、未公开的规划），你会如何回应？",type:"single",options:[L("A","礼貌说明「这些信息属于公司内部机密，不便透露」，同时引导沟通回到合作相关的公开话题。"),L("B","模糊回应「大概是 XX 范围」，既不明确拒绝，也不详细说明。"),L("C","觉得对方是重要合作方，透露部分数据能促进合作，就简单说明。"),L("D","说「我不清楚具体数据，需要问领导」，然后找领导推脱。")]},{id:18,stem:"你是如何看待金钱观的？",type:"single",options:[L("A","钱很重要，没有钱活不了，我要赚更多钱。"),L("B","钱乃身外之物，够吃喝就可以了。"),L("C","钱多钱少无所谓，有就花掉，没有就去赚。"),L("D","钱是对一个人能力和努力的综合匹配，享受赚许多钱的快感。")]},{id:19,stem:"你认为这个世界是什么样的？",type:"single",options:[L("A","完全有序的"),L("B","有序和混乱并存"),L("C","完全混乱的"),L("D","有序和混乱交替出现")]},{id:20,stem:"当下有些公司要求员工必须忠诚老板和公司，你是怎么看待这个事情的？",type:"single",options:[L("A","员工和老板之间，忠诚谈不上，只要员工把自己的事情做好就可以了。"),L("B","只要还在公司，员工应该忠诚老板，至少老板给我在这个岗位成长和摸索的机会。"),L("C","忠诚太大了，老板也保证不了员工一辈子，没准老板有天可能炒掉我。"),L("D","忠诚这个词不应该用到老板和员工之间，那是过去皇帝和大臣之间的衡量；我只要按照公司的要求做事情就可以了。")]}],Gy={apply:{key:"apply",label:"面试登记表",short:"登记表",minutes:15},values:{key:"values",label:"价值观文审",short:"价值观",minutes:8},fpa:{key:"fpa",label:"性格色彩 FPA",short:"性格色彩",minutes:10},writing:{key:"writing",label:"英文笔试",short:"笔试",minutes:10},speaking:{key:"speaking",label:"外贸口语",short:"口语",minutes:5},interview:{key:"interview",label:"专业面谈",short:"面谈",minutes:12}},Lu=["apply","values","fpa","writing","speaking","interview"];function Gi(e){const t=Array.isArray(e)?e:Array.isArray(e==null?void 0:e.modules)?e.modules:Lu,n=new Set(t),s=Lu.filter(i=>n.has(i)).map(i=>Gy[i]);return s.length>0?s:Yy}function pr(e,t){const n=Gi(t),s=n.findIndex(a=>a.key===e),i=s>=0?s+1:1,l=n.length;return{index:i,total:l,label:`环节 ${i} / ${l}`}}function ir(e,t){const n=Gi(t),s=n.findIndex(i=>i.key===e);return s>=0&&s<n.length-1?`/${n[s+1].key}`:"/done"}const Xy={apply:"填写面试登记表，信息越完整，后续判断越准",values:"20 道价值观判断题，8 分钟内完成",fpa:"30 道性格色彩题，10 分钟内完成",writing:"10 分钟写一封英文客户跟进信"};function Jy(e,t){return e==="speaking"?`${t.speaking} 个英文问题，语音提 I hope this letter finds you well. I am Jack from ... We sent you the samples on May 1st, and the tracking record shows that the parcel was delivered to your address on May 10th. However, we have not received any reply from you since then, and we could not reach you by phone or WhatsApp.

I am writing to confirm whether everything is fine with you, and whether there is any problem with the samples during your testing. If you have any concerns, please let us know — is it about the price, the quality, or any change in your purchasing plan? We would be glad to adjust our offer and support you in the best way.

Best regards,
